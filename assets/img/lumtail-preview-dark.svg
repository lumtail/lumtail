<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" fill="none" role="img" aria-labelledby="title desc">
    <title id="title">Lumtail reading a mixed-format log</title>
    <desc id="desc">Actual output from the included mixed.log and modules.json samples. JSON Lines, syslog, access logs and custom records share one stream. Only severity labels are colored; unrecognized text is preserved.</desc>
    <rect width="1120" height="420" rx="20" fill="#1D1F1E"/>
    <path d="M56 106H1064" stroke="#363832"/>
    <g font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" xml:space="preserve">
        <text x="56" y="68" fill="#EEE9DF"><tspan fill="#E9A84C">$</tspan> lumtail --rules examples/modules.json examples/mixed.log</text>
    </g>
    <g font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17" fill="#EEE9DF" xml:space="preserve">
        <text x="56" y="156">2026-11-07T18:30:00+01:00 │ <tspan fill="#94BAA5">INFO</tspan> │ api │ Server ready</text>
        <text x="56" y="190">Nov  7 18:30:01 │ <tspan fill="#E5988E">ERROR</tspan> │ host sshd │ Authentication failed</text>
        <text x="56" y="224">07/Nov/2026:18:30:02 +0100 │ <tspan fill="#94BAA5">INFO</tspan> │ 127.0.0.1 │ GET /health → 200 │ 12</text>
        <text x="56" y="258">07/Nov/2026:18:30:03 +0100 │ <tspan fill="#E5988E">ERROR</tspan> │ 127.0.0.1 │ POST /orders → 503 │ 128</text>
        <text x="56" y="292">2026-11-07T18:30:04+01:00 │ <tspan fill="#E5988E">ERROR</tspan> │ billing │ Payment rejected</text>
        <text x="56" y="326">[<tspan fill="#E9A84C">WARN</tspan>] worker 7 → Queue almost full</text>
        <text x="56" y="360">An unstructured record, preserved by the plain module.</text>
    </g>
</svg>
