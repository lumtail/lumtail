        <text x="89" y="390" fill="#B4B0A7" font-size="28" font-weight="400" letter-spacing="-0.4">Live. Unified. Monitoring and tailing.</text>
        <text x="89" y="554" fill="#8D8B82" font-size="16" letter-spacing="1">C++23 · Linux &amp; macOS</text>
