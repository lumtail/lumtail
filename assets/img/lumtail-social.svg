<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title desc">
    <title id="title">Lumtail. Live. Unified. Monitoring and tailing.</title>
    <desc id="desc">A warm white Lumtail wordmark on charcoal, with three fine log lines continuing into an amber tail.</desc>
    <defs>
        <linearGradient id="fade" x1="620" y1="0" x2="1184" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#373630" stop-opacity="0"/>
            <stop offset="1" stop-color="#777268"/>
        </linearGradient>
        <linearGradient id="tail" x1="620" y1="0" x2="1164" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#E9A84C" stop-opacity="0"/>
            <stop offset="0.65" stop-color="#E9A84C" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#E9A84C"/>
        </linearGradient>
    </defs>
    <path fill="#1D1F1E" d="M0 0H1280V640H0Z"/>
    <g transform="translate(72 78) scale(0.625)" stroke-width="8" stroke-linecap="round">
        <path d="M24 36H72M24 60H56" stroke="#EEE9DF"/>
        <path d="M24 84H64C86.091 84 104 66.091 104 44V28" stroke="#E9A84C"/>
    </g>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
