<text x="64" y="1048" fill="#182e36" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Percentages show selected records. Absent prefixes emit zero records after scanning the complete input.</text>
<text x="64" y="1078" fill="#182e36" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Input repeats whole source passes where needed; syslog uses a 256 MiB source prefix. Timings are informational.</text>
