name: ClusterFuzzLite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clusterfuzzlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            sanitizer: address
          - name: UBSan
            sanitizer: undefined
    steps:
      - name: Build instrumented fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-unaffected-fuzz-targets: true
          allowed-broken-targets-percentage: 0
      - name: Fuzz every target against the pull request
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
          mode: code-change
          fuzz-seconds: 300
          report-timeouts: true
          report-ooms: true
