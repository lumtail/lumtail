name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ambient -I paths can shadow CMake's selected -isystem dependency headers.
env:
  CPATH: ""
  CPLUS_INCLUDE_PATH: ""
  C_INCLUDE_PATH: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 12
            os: ubuntu-24.04
            compiler: g++-12
            compiler-package: g++-12
            build-type: Release
            sanitize: false
            simd: true
          - name: Linux / GCC 14
            vendored: true
            os: ubuntu-24.04
            compiler: g++-14
            build-type: Release
            sanitize: false
            simd: true
          - name: macOS / Apple Clang
            os: macos-26
            compiler: clang++
            build-type: Release
            sanitize: false
            simd: true
          - name: Linux / Clang 19
            os: ubuntu-24.04
            compiler: clang++-19
            compiler-package: clang-19
            build-type: Release
            sanitize: false
            simd: true
          - name: Linux / POSIX fallback / no LTO
            os: ubuntu-24.04
            compiler: g++-14
            build-type: Debug
            sanitize: false
            simd: true
            fallback: true
          - name: Linux ARM64 / GCC 14
            os: ubuntu-24.04-arm
            compiler: g++-14
            compiler-package: g++-14
            build-type: Release
            sanitize: false
            simd: true
          - name: macOS Intel / Apple Clang
            os: macos-26-intel
            compiler: clang++
            build-type: Release
            sanitize: false
            simd: true
          - name: Linux / scalar byte kernels
            os: ubuntu-24.04
            compiler: g++-14
            build-type: Release
            sanitize: false
            simd: false
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install compatibility compiler
        if: matrix.compiler-package
        env:
          PACKAGE: ${{ matrix.compiler-package }}
        run: sudo apt-get update && sudo apt-get install -y "$PACKAGE"

      - name: Show toolchain
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          "$CXX" --version
          cmake --version
          python3 --version

      - name: Install pinned beautifier
        run: |
          python3 -m venv build-tools/venv
          build-tools/venv/bin/python -m pip install -r tools/requirements-format.txt

      - name: Run quality gate
        env:
          CXX: ${{ matrix.compiler }}
          BUILD_TYPE: ${{ matrix.build-type }}
          SANITIZE: ${{ matrix.sanitize }}
          SIMD: ${{ matrix.simd }}
          FALLBACK: ${{ matrix.fallback }}
          VENDORED: ${{ matrix.vendored }}
        run: |
          flags=()
          if [[ "$FALLBACK" == "true" ]]; then
            flags+=(-DLUMTAIL_HAS_O_CLOEXEC=OFF -DLUMTAIL_LTO=OFF)
          fi
          if [[ "$VENDORED" == "true" ]]; then
            flags+=(-DCMAKE_DISABLE_FIND_PACKAGE_simdjson=ON -DCMAKE_DISABLE_FIND_PACKAGE_nlohmann_json=ON)
          fi
          python3 tools/dev.py gate --build-dir build --build-type "$BUILD_TYPE" \
            --jobs 2 --cmake-arg=-DLUMTAIL_SANITIZERS="$SANITIZE" \
            --cmake-arg=-DLUMTAIL_SIMD="$SIMD" \
            --cmake-arg=-DLUMTAIL_BUILD_BENCHMARKS=ON "${flags[@]/#/--cmake-arg=}"

      - name: Check dependency header isolation
        if: matrix.vendored
        run: python3 tests/dependency_headers.py build

      - name: Check installation
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/lumtail"
          "$RUNNER_TEMP/lumtail/bin/lumtail" --version
          "$RUNNER_TEMP/lumtail/bin/lumtail" --rules examples/modules.json examples/mixed.log

      - name: Require native confinement on Linux
        if: runner.os == 'Linux' && matrix.sanitize == false
        run: |
          "$RUNNER_TEMP/lumtail/bin/lumtail" --require-sandbox --sandbox-status
          "$RUNNER_TEMP/lumtail/bin/lumtail" --require-sandbox \
            --rules examples/modules.json examples/mixed.log

      - name: Keep build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ strategy.job-index }}-${{ runner.os }}
          path: |
            build/compile_commands.json
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/
            build/api-contracts/

  required:
    name: CI required
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build to pass
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
